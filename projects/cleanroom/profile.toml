slug = "cleanroom"
repository = "duck-lint/CLEANROOM"
git_remote = "git@github-cleanroom:duck-lint/CLEANROOM.git"
secret_reference = "github.token"
dispatch_labels = ["symphony:auto"]
blocked_label = "symphony:human"
dashboard_port = 4040
max_concurrent_agents = 1
max_turns = 8
poll_interval_ms = 5000
max_retry_backoff_ms = 300000
codex_model = "gpt-5.6-luna"
codex_reasoning_effort = "high"
toolchain = "rust"
prevent_host_sleep = true
notifications_enabled = true
display_name = "CLEANROOM"
notification_backend = "windows-toast"
