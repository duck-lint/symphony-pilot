name: Symphony Step 8 Windows native contract

on:
  pull_request:
  push:
    branches:
      - codex/step-8-deployment-immutability

permissions:
  contents: read

jobs:
  windows-native:
    name: Tier B hosted Windows native behavior
    runs-on: windows-2022
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Preserve source bytes for digest contracts
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Create evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts/step8 | Out-Null

      - name: Collect Windows native observation
        shell: pwsh
        run: ./scripts/collect_step8_windows_observation.ps1 -OutputPath artifacts/step8/windows-host.json

      - name: Record hosted WSL grammar availability
        shell: pwsh
        run: |
          $wsl = Join-Path $env:SystemRoot "System32\wsl.exe"
          $available = $false
          $help = ""
          if (Test-Path -LiteralPath $wsl -PathType Leaf) {
            $help = (& $wsl --help 2>&1 | Out-String)
            $available = $help -match '(?m)--mount' -and $help -match '(?m)--vhd' -and
              $help -match '(?m)--bare' -and $help -match '(?m)--unmount'
          }
          $document = Get-Content -LiteralPath artifacts/step8/windows-host.json -Raw | ConvertFrom-Json
          $document | Add-Member -NotePropertyName wsl_grammar -NotePropertyValue ([ordered]@{
            available = $available
            required_tokens = @("--mount", "--vhd", "--bare", "--unmount")
          }) -Force
          $document | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath artifacts/step8/windows-host.json -Encoding utf8NoBOM
          if (-not $available) {
            Write-Warning "hosted Windows WSL direct-VHD grammar unavailable; this is not Tier C evidence"
          }

      - name: Verify compatible Windows native contract
        shell: pwsh
        run: python scripts/verify_step8_host.py --tier windows-native --observed-file artifacts/step8/windows-host.json --output artifacts/step8/windows-verification.json

      - name: Parse the production VHDX operator script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/provision_storage_vhdx.ps1),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Out-String | Write-Error; exit 1 }

      - name: Run Windows storage and ACL contract tests
        id: windows-tests
        shell: pwsh
        run: |
          $output = & python -m unittest tests.test_quota_helper_contract -v 2>&1 | Tee-Object -FilePath artifacts/step8/windows-tests.log
          if ($LASTEXITCODE -ne 0) {
            $summary = (($output | Select-String -Pattern 'FAIL|ERROR|AssertionError|Traceback' | Select-Object -First 12) -join ' ')
            if (-not $summary) { $summary = 'focused Windows storage contract suite failed; see windows-tests.log' }
            Write-Output "::error file=tests/test_quota_helper_contract.py::$summary"
            exit $LASTEXITCODE
          }

      - name: Write final exact-SHA evidence
        if: always()
        shell: pwsh
        run: python scripts/write_step8_evidence.py --tier windows-native --result "${{ job.status }}" --observed-file artifacts/step8/windows-verification.json --output artifacts/step8/windows-final.json

      - name: Upload Tier B evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step8-windows-evidence-${{ github.sha }}
          path: artifacts/step8
