name: Symphony Step 8 disposable target twin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-twin:
    name: Tier C disposable Windows and WSL2 target twin
    if: github.repository == 'duck-lint/symphony-pilot' && github.ref == 'refs/heads/codex/step-8-deployment-immutability'
    runs-on:
      - self-hosted
      - windows
      - x64
      - symphony-target
      - symphony-disposable
    env:
      SYMPHONY_TARGET_MARKER: C:\SymphonyTargetRunner\runner-marker.json
      SYMPHONY_TARGET_VHDX: C:\ProgramData\SymphonyPilot\symphony-storage.vhdx
      SYMPHONY_TARGET_SIDECAR: C:\ProgramData\SymphonyPilot\symphony-storage.vhdx.attachment.json
      SYMPHONY_SOURCE_ROOT: /mnt/f/PROJECT-REPOS/symphony-pilot
      SYMPHONY_DEPLOYMENT_ROOT: /home/duck-lint/.local/share/symphony-pilot/deployments/symphony-canary
    steps:
      - name: Checkout exact trusted branch SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify trusted event and disposable runner marker
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne "duck-lint/symphony-pilot") { throw "unexpected repository" }
          if ($env:GITHUB_REF -ne "refs/heads/codex/step-8-deployment-immutability") { throw "unexpected trusted ref" }
          if (-not (Test-Path -LiteralPath $env:SYMPHONY_TARGET_MARKER -PathType Leaf)) { throw "disposable target runner marker is absent" }
          $marker = Get-Content -LiteralPath $env:SYMPHONY_TARGET_MARKER -Raw | ConvertFrom-Json
          if ($marker.schema -ne "symphony-pilot-disposable-target-runner/v1") { throw "disposable target runner marker schema is not accepted" }
          if ($marker.disposable -ne $true) { throw "runner is not marked disposable" }

      - name: Create evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts/step8 | Out-Null

      - name: Verify exact target contract before fixture mutation
        shell: pwsh
        run: |
          ./scripts/collect_step8_windows_observation.ps1 -IncludeWsl -OutputPath artifacts/step8/target-host.json
          python scripts/verify_step8_host.py --tier target-twin --observed-file artifacts/step8/target-host.json --output artifacts/step8/target-verification.json

      - name: Verify exact source and Runtime candidates
        shell: pwsh
        run: |
          $sourceSha = (& wsl.exe -d Ubuntu-24.04 --user duck-lint -- /usr/bin/git -C $env:SYMPHONY_SOURCE_ROOT rev-parse HEAD).Trim()
          if ($sourceSha -ne $env:GITHUB_SHA) { throw "target twin source SHA is not the exact workflow SHA" }
          $runtimeSha = (& wsl.exe -d Ubuntu-24.04 --user duck-lint -- /usr/bin/git -C /mnt/f/PROJECT-REPOS/symphony-runtime rev-parse HEAD).Trim()
          if ($runtimeSha -ne "c584331afafbb317861ecef338558d88db5a9f2c") { throw "target twin Runtime SHA is not frozen" }
          if (-not (Test-Path -LiteralPath $env:SYMPHONY_TARGET_VHDX)) { }
          elseif (Test-Path -LiteralPath $env:SYMPHONY_TARGET_VHDX -PathType Leaf) { throw "disposable VHDX fixture leaf already exists" }
          else { throw "disposable VHDX fixture path is not a normal absent leaf" }
          if (Test-Path -LiteralPath $env:SYMPHONY_TARGET_SIDECAR) { throw "disposable attachment sidecar is not absent" }

      - name: Run real Pilot deployment and frozen verifier
        shell: pwsh
        run: |
          & wsl.exe -d Ubuntu-24.04 --user duck-lint -- /usr/bin/python3 -B "$env:SYMPHONY_SOURCE_ROOT/scripts/deploy.py" --project symphony-canary
          if ($LASTEXITCODE -ne 0) { throw "disposable deployment failed" }
          & wsl.exe -d Ubuntu-24.04 --user duck-lint -- /usr/bin/python3 -B "$env:SYMPHONY_SOURCE_ROOT/scripts/project.py" --project symphony-canary test
          if ($LASTEXITCODE -ne 0) { throw "frozen deployment verification failed" }

      - name: Verify disposable fixture leaves before attachment
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:SYMPHONY_TARGET_VHDX) { throw "disposable VHDX fixture is not clean" }
          if (Test-Path -LiteralPath $env:SYMPHONY_TARGET_SIDECAR) { throw "disposable attachment cache is not clean" }

      - name: Run disposable storage lifecycle through reviewed operator paths
        shell: pwsh
        run: |
          # This job is the only reviewed location allowed to mutate its
          # disposable fixture. Production paths and credentials are absent.
          $attachOutput = & ./scripts/provision_storage_vhdx.ps1 -Operation Attach 2>&1
          $attachStatus = $LASTEXITCODE
          $attachText = ($attachOutput -join [Environment]::NewLine)
          $attachText | Set-Content -LiteralPath artifacts/step8/attach-output.txt -Encoding utf8NoBOM
          if ($attachStatus -ne 0) { throw "disposable VHDX Attach failed" }
          $attach = ($attachOutput | Select-Object -Last 1 | ConvertFrom-Json)
          $attach | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath artifacts/step8/attach-evidence.json -Encoding utf8NoBOM
          if ($attach.LinuxDevice -notmatch '^/dev/[^/]+$') { throw "Attach did not return a bounded Linux device identity" }
          $before = @($attach.LinuxDevicesBefore)
          $after = @($attach.LinuxDevicesAfter)
          $added = @($after | Where-Object { $_ -notin $before })
          $removed = @($before | Where-Object { $_ -notin $after })
          if ($added.Count -ne 1 -or $added[0] -ne $attach.LinuxDevice -or $removed.Count -ne 0) {
            throw "Attach evidence does not prove one attributable new Linux whole disk"
          }
          if ($after -contains '/dev/sdd' -and $before -notcontains '/dev/sdd') { throw '/dev/sdd appeared during Attach' }
          & wsl.exe -d Ubuntu-24.04 --user root -- /bin/sh "$env:SYMPHONY_DEPLOYMENT_ROOT/scripts/provision_storage_domain.sh" $attach.LinuxDevice
          if ($LASTEXITCODE -ne 0) { throw "disposable Linux storage provisioning failed" }
          $probeOutput = & wsl.exe -d Ubuntu-24.04 --user duck-lint -- /usr/bin/python3 -B "$env:SYMPHONY_SOURCE_ROOT/scripts/step8_target_twin_probe.py" 2>&1
          $probeStatus = $LASTEXITCODE
          $probeText = ($probeOutput -join [Environment]::NewLine)
          $probeText | Set-Content -LiteralPath artifacts/step8/storage-probe-output.txt -Encoding utf8NoBOM
          if ($probeStatus -ne 0) { throw "disposable quota/reclamation probe failed" }
          $probe = ($probeOutput | Select-Object -Last 1 | ConvertFrom-Json)
          $probe | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath artifacts/step8/storage-probe-evidence.json -Encoding utf8NoBOM
          if ($probe.schema -ne 'symphony-pilot-target-twin-storage-probe/v1' -or
              $probe.workspace_reclaimed -ne $true -or $probe.workspace_absent -ne $true -or
              $probe.release.quota_state -ne 'removed' -or $probe.release.growth_possible -ne $false -or
              $probe.reservation_after.status -ne 'released') {
            throw "disposable quota/reclamation evidence is incomplete"
          }

      - name: Run exact deployment and storage evidence checks
        shell: pwsh
        run: |
          & wsl.exe -d Ubuntu-24.04 --user duck-lint -- /usr/bin/python3 -B "$env:SYMPHONY_SOURCE_ROOT/scripts/project.py" --project symphony-canary test
          if ($LASTEXITCODE -ne 0) { throw "post-provision deployment verification failed" }
          & wsl.exe -d Ubuntu-24.04 --user duck-lint -- /usr/bin/python3 -B "$env:SYMPHONY_SOURCE_ROOT/scripts/run_step8_full_suite.py" --log /tmp/step8-target-twin-tests.log
          if ($LASTEXITCODE -ne 0) { throw "target-twin full Pilot suite failed" }

      - name: Detach and clean disposable fixture
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:SYMPHONY_TARGET_VHDX -PathType Leaf)) { return }
          $detachOutput = & ./scripts/provision_storage_vhdx.ps1 -Operation Detach 2>&1
          $detachStatus = $LASTEXITCODE
          $detachText = ($detachOutput -join [Environment]::NewLine)
          $detachText | Set-Content -LiteralPath artifacts/step8/detach-output.txt -Encoding utf8NoBOM
          if ($detachStatus -ne 0) { throw "disposable VHDX Detach failed" }
          $detach = ($detachOutput | Select-Object -Last 1 | ConvertFrom-Json)
          $detach | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath artifacts/step8/detach-evidence.json -Encoding utf8NoBOM
          $attach = $null
          if (Test-Path -LiteralPath artifacts/step8/attach-evidence.json -PathType Leaf) {
            $attach = Get-Content -LiteralPath artifacts/step8/attach-evidence.json -Raw | ConvertFrom-Json
          }
          $before = @($detach.LinuxDevicesBefore)
          $after = @($detach.LinuxDevicesAfter)
          $removed = @($before | Where-Object { $_ -notin $after })
          $added = @($after | Where-Object { $_ -notin $before })
          if ($null -ne $attach -and ($detach.AttachmentAction -ne 'reconciled-detached' -or
              $removed.Count -ne 1 -or $removed[0] -ne $attach.LinuxDevice -or $added.Count -ne 0)) {
            throw "Detach evidence does not prove exact-path causal cleanup"
          }
          if (Test-Path -LiteralPath $env:SYMPHONY_TARGET_SIDECAR) { throw "attachment sidecar survived Detach" }
          Remove-Item -LiteralPath $env:SYMPHONY_TARGET_VHDX -Force -ErrorAction Stop
          if (Test-Path -LiteralPath $env:SYMPHONY_TARGET_VHDX) { throw "disposable VHDX fixture leaf survived cleanup" }

      - name: Write final exact-SHA evidence
        if: always()
        shell: pwsh
        run: python scripts/write_step8_evidence.py --tier target-twin --result "${{ job.status }}" --observed-file artifacts/step8/target-verification.json --output artifacts/step8/target-final.json

      - name: Upload Tier C evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step8-target-evidence-${{ github.sha }}
          path: artifacts/step8
